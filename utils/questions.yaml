meta:
  title:
    en: "By-Laws Revision — Board Member Policy Questionnaire"
    zh: "章程修订——理事会政策问卷"
  organization:
    en: "South China University of Technology Alumni, America"
    zh: "华南理工大学美国校友会"
  issued_by:
    en: "By-Laws Revision Drafting Committee"
    zh: "章程修订起草委员会"

sections:
  - id: "1"
    title:
      en: "Vision and Purpose"
      zh: "愿景与宗旨"
    description:
      en: >
        The current By-Laws list five purposes but contain no vision statement, no values,
        and no definition of whom the organization ultimately serves. This section asks the
        Board to clarify the organization's fundamental identity.
      zh: >
        现行章程列举了五项宗旨，但没有愿景声明、价值观表述，也未界定组织最终服务于谁。
        本节请理事会明确组织的根本定位。
    questions:
      - id: "Q1.1"
        title:
          en: "Geographic Scope"
          zh: "地理服务范围"
        context:
          en: >
            The organization's name says "Alumni, America," but this is never defined in the
            By-Laws. As a result, it is unclear whether alumni in Hawaii, Alaska, Canada, or
            U.S. territories are eligible members.
          zh: >
            本会名称为"华南理工大学美国校友会"，但章程从未对"美国"作出界定。因此，夏威夷、
            阿拉斯加、加拿大或美国领地的校友是否具备会员资格，目前并不明确。
        prompts:
          en:
            - "Which geographic area should the By-Laws define as this organization's territory? (e.g., the 50 U.S. states only; U.S. states plus territories; North America broadly)"
            - "If a SCUT alumnus lives in Canada, should they be eligible to join — or is that a different organization's responsibility?"
            - "Should the By-Laws contemplate the possibility of future regional chapters, and if so, should the national body's territory be defined accordingly?"
          zh:
            - "章程应如何界定本会的地理服务范围？（例如：仅限美国50个州；美国各州及领地；或泛指北美）"
            - "如果一位华工校友居住在加拿大，他/她是否有资格加入本会？还是应由其他组织负责？"
            - "章程是否应为未来设立地区分会预留空间？若是，母会的地理范围应如何相应界定？"

      - id: "Q1.2"
        title:
          en: "Whom Does the Organization Serve?"
          zh: "服务对象"
        context:
          en: >
            The current purposes mix member-focused goals (friendship, professional development)
            with outward-facing goals (supporting SCUT's development and worldwide reputation).
            The Board should decide whether the primary beneficiary is the membership itself,
            the broader SCUT community, or both.
          zh: >
            现行章程的宗旨兼顾了面向会员的目标（友谊、职业发展）和面向外部的目标（支持华工发展及
            国际声誉）。理事会须明确：本会的主要受益者是会员本身，还是更广泛的华工社群？
        prompts:
          en:
            - "Who is the primary beneficiary of this organization — its own members, or also the SCUT community at large (including SCUT itself, current students, and prospective students)?"
            - "Should the organization explicitly commit to supporting newly-arrived SCUT graduates transitioning to life in the U.S. — or is that outside its scope?"
            - "Should the organization serve the broader Chinese-American or SCUT-adjacent community, or remain strictly an alumni association?"
          zh:
            - "本会的主要受益者是谁——会员本身，还是也包括更广泛的华工社群（包括华工本身、在读学生和潜在学生）？"
            - "本会是否应明确承诺为初来美国的华工毕业生提供过渡支持？还是这不在本会服务范围之内？"
            - "本会是否应服务于更广泛的华人社区或华工相关社群，还是应保持纯校友组织定位？"

      - id: "Q1.3"
        title:
          en: "Values and Cultural Identity"
          zh: "价值观与文化认同"
        context:
          en: >
            The current By-Laws are purely operational. Many peer organizations adopt a brief
            statement of values or explicitly acknowledge the cultural dimension of their work.
          zh: >
            现行章程仅有运营性规定。许多同类组织的章程包含简短的价值观声明，或明确提及文化认同的维度。
        prompts:
          en:
            - "Should the By-Laws include a values statement (e.g., community, mutual support, cultural pride, excellence)? If yes, what values would you include?"
            - "Should the By-Laws explicitly mention the cultural or Chinese heritage dimension of the organization's work, or keep the language neutral and functional?"
            - "Should any values be drawn from SCUT's own institutional motto or ethos?"
          zh:
            - "章程是否应包含价值观声明（例如：社群归属、互助共进、文化认同、追求卓越）？若是，您希望纳入哪些价值观？"
            - "章程是否应明确提及组织工作的文化或中华传承维度，还是保持中性的功能性语言？"
            - "章程中的价值观是否应参考华南理工大学的校训或校园精神？"

      - id: "Q1.4"
        title:
          en: "Non-Political Clause and Relationship with SCUT"
          zh: "非政治条款与对华工的关系"
        context:
          en: >
            The By-Laws currently prohibit "political activities" without defining what that means.
            They also mention SCUT without defining the relationship.
          zh: >
            现行章程禁止"政治活动"，但未对此作出界定。章程提及华工，但未界定双方关系。
        prompts:
          en:
            - "How should \"political activities\" be defined? (e.g., endorsing candidates/parties only; or also advocating on immigration/visa policies; or inviting elected officials to speak)"
            - "Is this organization formally affiliated with, recognized by, or endorsed by SCUT's alumni office? Should the By-Laws say so — and if so, what obligations does that relationship create?"
            - "If the organization is independent of SCUT, should the By-Laws say so explicitly?"
          zh:
            - "\"政治活动\"应如何界定？例如：是否仅指为候选人或政党背书？还是也包括就直接影响校友的移民或签证政策发声？邀请民选官员演讲是否算作政治活动？"
            - "本会是否正式隶属于、获认可或经华工校友办公室背书？章程是否应作出说明——若是，这种关系会带来哪些义务？"
            - "如果本会独立于华工，章程是否应明确说明？"

      - id: "Q1.5"
        title:
          en: "Language of the By-Laws"
          zh: "章程语言"
        context:
          en: >
            The current By-Laws are in English only. Many members are more comfortable in Chinese.
          zh: >
            现行章程仅有英文版本，但许多会员更习惯中文。
        prompts:
          en:
            - "Should the By-Laws remain English-only (the legally required language for a California corporation)?"
            - "Should a Chinese translation be provided as an unofficial appendix for members' reference?"
            - "If both versions are produced, which version controls in case of conflict?"
          zh:
            - "章程是否应保持仅有英文版本（加州对法人章程的法定语言要求）？"
            - "是否应提供中文译本作为非正式附件，供会员参考？"
            - "如同时存在两个语言版本，发生分歧时以哪个版本为准？"

  - id: "2"
    title:
      en: "Leadership Structure"
      zh: "领导架构"
    description:
      en: >
        The current By-Laws create a Board of 11–21 Directors, a Chairman, up to six Vice Chairmen,
        a Secretary, and a Treasurer — all serving three-year terms. No other roles are defined.
        This section asks the Board to modernize the leadership structure.
      zh: >
        现行章程规定：理事会由11至21名理事组成，设一名会长、最多六名副会长、一名秘书长、一名财务长，
        任期均为三年，其他职位均无定义。本节请理事会对领导架构进行现代化调整。
    questions:
      - id: "Q2.1"
        title:
          en: "Board Size and Composition"
          zh: "理事会规模与构成"
        context:
          en: >
            The current range of 11–21 Directors is wide. The minimum of 11 can be difficult to
            sustain; the maximum of 21 may make meetings unwieldy.
          zh: >
            现行11至21人的范围较宽。最低11人有时难以维持；最高21人可能使会议效率低下。
        prompts:
          en:
            - "Is the current range (11–21) still appropriate, or should it be adjusted? If so, what range would you recommend?"
            - "Should the Board size be fixed (e.g., exactly 15) rather than a range, to make quorum calculations predictable?"
            - "How many active, engaged Board members does the organization realistically have, and what minimum is achievable?"
          zh:
            - "现行范围（11至21人）是否仍然适当？如需调整，您建议的范围是多少？"
            - "是否应固定理事人数（例如：恰好15人），以便法定人数计算更为明确？"
            - "本会实际上能维持多少名积极参与的理事？可实现的最低人数是多少？"

      - id: "Q2.2"
        title:
          en: "Officer Titles and Roles"
          zh: "干部职称与职责"
        context:
          en: >
            The current titles (Chairman, Vice Chairmen) are gendered and old-fashioned by modern
            standards. The Vice Chairmen currently have no defined portfolios.
          zh: >
            现行职称（Chairman、Vice Chairmen）在现代标准下带有性别倾向且略显陈旧。各副会长目前没有明确的职责分工。
        prompts:
          en:
            - "Should titles be updated? (Options: keep Chairman/Vice Chairmen; adopt President/Vice President; adopt Chair/Vice Chair)"
            - "How many Vice Presidents/Vice Chairs should there be? Should each have a defined role (e.g., one for internal affairs, one for events, one for SCUT relations)?"
            - "Should any new officer roles be formally created — for example, a Communications Officer or a Young Alumni Coordinator?"
          zh:
            - "职称是否应更新？（选项：保留会长/副会长现称；改用President/Vice President；改用Chair/Vice Chair）"
            - "应设几名副会长？每位是否应有明确的职责领域（例如：内部事务、活动、华工关系）？"
            - "是否应正式设立新的干部职位？例如：通讯干事、数字运营干事、青年校友协调员等。"

      - id: "Q2.3"
        title:
          en: "Executive Committee"
          zh: "执行委员会"
        context:
          en: >
            Some peer organizations create a small Executive Committee (typically President +
            Vice Presidents) that can make routine decisions between full Board meetings, subject
            to Board ratification.
          zh: >
            部分同类组织设立了小型执行委员会（通常由会长加各副会长组成），在全体理事会会议之间处理
            日常决策，相关决定须提交理事会批准。
        prompts:
          en:
            - "Should an Executive Committee be established with delegated authority to act on routine matters between Board meetings?"
            - "If yes, what decisions can the Executive Committee make on its own, and which must go to the full Board?"
            - "Is there a risk that an Executive Committee would sideline the broader Board — and how should the By-Laws guard against that?"
          zh:
            - "是否应设立执行委员会，并授权其在理事会会议之间处理日常事务？"
            - "若是，哪些决策可由执行委员会自行作出，哪些须提交全体理事会？"
            - "执行委员会是否存在架空理事会其他成员的风险？章程应如何防范？"

      - id: "Q2.4"
        title:
          en: "Term Limits and Staggered Terms"
          zh: "任期限制与交错任期"
        context:
          en: >
            Currently all Directors serve three-year terms with no limit on consecutive terms,
            and all terms start and end at the same time. This risks both indefinite incumbency
            and complete board turnover at once.
          zh: >
            目前所有理事均任期三年，没有连任次数限制，且所有任期同步开始和结束。这既存在长期占据职位的
            风险，也存在理事会整体换届导致机构记忆断层的风险。
        prompts:
          en:
            - "Should there be a maximum number of consecutive terms a Director or officer may serve (e.g., three terms, after which a one-term gap is required)?"
            - "Should terms be staggered so that only a portion of the Board is up for election each year, preserving institutional continuity?"
            - "If staggered terms are adopted, how would the transition be managed the first time?"
          zh:
            - "是否应规定理事或干部的最高连续任期届数（例如：连任三届后须间隔一届才可再次参选）？"
            - "是否应实行交错任期，使每年仅有部分理事参加改选，以保持机构延续性？"
            - "如引入交错任期，首次过渡应如何安排？"

      - id: "Q2.5"
        title:
          en: "Succession, Line of Authority, and Board-Member Relationship"
          zh: "继任顺序、权力架构与理事会-会员关系"
        context:
          en: >
            The current By-Laws are silent on what happens if the Chairman and all Vice Chairmen
            are simultaneously unavailable, and say little about what decisions must go to the membership.
          zh: >
            现行章程对会长和所有副会长同时无法履职时的处置方案只字未提，对哪些决策须提交会员大会的规定也甚少。
        prompts:
          en:
            - "What is the line of succession if the Chairman and all Vice Chairmen are unavailable — who acts next (e.g., the Secretary)?"
            - "Should there be any decisions, beyond By-Law amendments, that require a membership vote (e.g., dissolution, major expenditures)?"
            - "Should members have a formal right to petition the Board to address a specific issue?"
          zh:
            - "如会长和所有副会长均无法履职，由谁代行职务（例如：秘书长）？继任顺序应如何规定？"
            - "除章程修订外，是否还应有其他决策须经会员大会表决（例如：解散、重大支出）？"
            - "会员是否应有权正式联署请愿，要求理事会就某一特定议题作出回应？"

  - id: "3"
    title:
      en: "Elections and Appointments"
      zh: "选举与任命程序"
    description:
      en: >
        The current By-Laws leave the nomination process undefined, the electronic voting
        process without rules, and mid-term vacancies without clear procedures.
      zh: >
        现行章程未界定提名程序，电子投票无任何规则，任期中途出现空缺时也无明确的处理程序。
    questions:
      - id: "Q3.1"
        title:
          en: "Nomination Process"
          zh: "提名程序"
        context:
          en: >
            Any member can currently be nominated "by a method authorized by the Board," but no
            method has been defined. This leaves elections vulnerable to confusion.
          zh: >
            目前，任何会员均可"以理事会认可的方式"被提名，但迄今尚未建立任何具体程序。这使选举面临混乱的风险。
        prompts:
          en:
            - "Is self-nomination allowed, or must candidates be nominated by other members?"
            - "Should a nominating committee review and present candidates, or should anyone who wishes to run be free to do so?"
            - "Should candidates be required to submit a biography, a brief platform statement, or a minimum service commitment?"
            - "Should there be a minimum membership tenure before a person can run (e.g., at least one year as a member)?"
          zh:
            - "是否允许自我提名，还是须由其他会员提名？"
            - "是否应设立提名委员会来审查并推荐候选人，还是允许任何有意参选者自由报名？"
            - "候选人是否须提交个人简介、竞选声明或最低服务承诺？"
            - "是否应规定参选资格所需的最短会籍年限（例如：须为会员满一年）？"

      - id: "Q3.2"
        title:
          en: "Electronic Voting"
          zh: "电子投票"
        context:
          en: >
            The By-Laws say elections "can be held electronically" but specify no platform, no
            verification method, and no process for counting or certifying results.
          zh: >
            现行章程规定选举"可以电子方式进行"，但未指定任何平台、身份核验方式或结果统计认证程序。
        prompts:
          en:
            - "Which platforms should be approved for electronic voting (e.g., a dedicated voting tool, Google Form, email ballot)? What authentication method confirms that only eligible members vote once each?"
            - "How long should the voting window be open?"
            - "Who administers and certifies the results, and are vote totals made public?"
            - "Should electronic voting be the default, or should in-person voting at the annual meeting be the default?"
          zh:
            - "哪些平台可获批准用于电子投票（例如：专用投票工具、Google表单、电子邮件投票）？采用何种身份验证方式确保只有合格会员投一次票？"
            - "投票窗口应开放多长时间？"
            - "由谁负责统计和认证结果？票数是否应予公开？"
            - "电子投票是否应作为默认方式，还是应以年度会员大会的现场投票为默认方式？"

      - id: "Q3.3"
        title:
          en: "Removal of Officers and Mid-Term Vacancies"
          zh: "罢免干部与任期中途空缺"
        context:
          en: >
            The current By-Laws allow the Chairman and Vice Chairmen to be recalled via a petition
            by one-third of the Board, but there is no process for removing the Secretary or
            Treasurer, and vacancies in officer positions are unaddressed.
          zh: >
            现行章程允许通过三分之一理事联署请愿的方式召回会长和副会长，但未规定撤换秘书长或财务长的程序，
            干部职位空缺时的处置方式也无任何规定。
        prompts:
          en:
            - "Should all officers be subject to the same recall process? Should \"for cause\" be required, or should a no-confidence vote suffice?"
            - "If the Chairman vacates mid-term, does the senior Vice Chairman automatically become Chairman, or should there be a new election?"
            - "Should mid-term replacements serve only the remainder of the original term?"
          zh:
            - "所有干部是否应适用相同的召回程序？是否须有\"合理理由\"，还是不信任投票即可启动？"
            - "若会长任期中途离职，由资深副会长自动接任，还是须重新选举？"
            - "任期中途的接替者，其任期是否仅延续至原任期届满？"

      - id: "Q3.4"
        title:
          en: "Transition and Handover Requirements"
          zh: "职务交接与移交要求"
        context:
          en: >
            There is currently no rule requiring outgoing officers to transfer organizational
            assets, accounts, and records to their successors.
          zh: >
            目前没有任何规定要求离任干部向继任者移交组织资产、账户和档案。
        prompts:
          en:
            - "Should there be a mandatory handover period (e.g., one month of overlap) between outgoing and incoming officers?"
            - "What should be included in a handover: bank account access, digital accounts, records, contact lists?"
            - "What is the deadline for completing the handover, and what happens if an outgoing officer does not comply?"
          zh:
            - "是否应规定强制交接期（例如：离任与继任干部重叠一个月）？"
            - "交接内容应包括哪些：银行账户权限、数字账号、档案、联系人名单等？"
            - "完成交接的截止期限是多久？离任干部不配合交接时如何处理？"

  - id: "4"
    title:
      en: "Membership and Eligibility"
      zh: "会员资格与标准"
    description:
      en: >
        The current By-Laws define eligibility vaguely and have no registration process, no dues
        structure, and no process for lapsed or terminated membership.
      zh: >
        现行章程对入会资格的界定模糊，没有正式注册程序，没有会费结构，也没有会籍失效或撤销程序。
    questions:
      - id: "Q4.1"
        title:
          en: "Eligibility Criteria"
          zh: "入会资格标准"
        context:
          en: >
            "Worked or studied at SCUT and currently lives or works in America" leaves many cases ambiguous.
          zh: >
            "曾在华工学习或工作、目前居住或工作于美国"的表述留有许多模糊地带。
        prompts:
          en:
            - "Should \"studied at SCUT\" require a degree, or does an exchange semester or short program count?"
            - "Does a current SCUT graduate student at a U.S. university qualify?"
            - "What happens to a member who moves back to China — do they retain membership?"
            - "Should faculty, staff, and administrators of SCUT be eligible (not just academic alumni)?"
          zh:
            - "\"在华工学习\"是否须取得学位，还是交换学期或短期项目也算？"
            - "目前在美国高校就读的华工研究生是否具备资格？"
            - "已回国的会员是否保留会籍？"
            - "华工的教职人员、行政人员及工作人员（非学术校友）是否具备资格？"

      - id: "Q4.2"
        title:
          en: "Membership Categories"
          zh: "会员类别"
        context:
          en: >
            Many peer organizations distinguish between different types of members with different rights.
          zh: >
            许多同类组织将会员划分为不同类别，各类别享有不同权利。
        prompts:
          en:
            - "Should the organization create distinct membership categories? (e.g., Regular Members with full voting rights; Associate Members for family or supporters without voting rights; Student Members for current SCUT students in the U.S.; Honorary Members for major contributors)"
            - "What rights and limitations should each category have (voting, holding office, attending events)?"
            - "Should family members of alumni be eligible for any form of membership?"
          zh:
            - "本会是否应设立不同的会员类别？（例如：享有完整表决权的正式会员；家属或支持者等无表决权的准会员；在美就读的华工学生会员；为重要贡献者设立的荣誉会员）"
            - "每类会员应享有哪些权利，受哪些限制（表决权、担任职务资格、活动参与权）？"
            - "校友的家属成员是否应具备任何形式的会员资格？"

      - id: "Q4.3"
        title:
          en: "Dues Structure and Administration"
          zh: "会费结构与会籍管理"
        context:
          en: >
            The current By-Laws give the Board full discretion over dues with no further structure.
            There is no formal registration or roll-keeping process.
          zh: >
            现行章程赋予理事会对会费的完全自由裁量权，既无正式注册程序，也无会员名册管理规定。
        prompts:
          en:
            - "Should dues be defined in the By-Laws with a specific amount, or should the Board retain full discretion?"
            - "Should there be different dues tiers — standard, student/recent graduate, lifetime?"
            - "Who is responsible for maintaining the membership roll, and what information must it contain?"
            - "How long after dues lapse does a member lose good standing and voting rights?"
          zh:
            - "会费金额是否应在章程中固定，还是应保留理事会的完全自由裁量权？"
            - "是否应设立分层会费：标准会费、学生/应届毕业生优惠、终身会员？"
            - "谁负责维护会员名册？名册须记录哪些信息？"
            - "会费逾期多久后，会员丧失良好会籍状态和表决权？"

      - id: "Q4.4"
        title:
          en: "Disciplinary Process"
          zh: "纪律处分程序"
        context:
          en: >
            There is currently no process for suspending or revoking a member's membership for misconduct.
          zh: >
            目前没有任何程序可对严重失范的会员予以暂停或撤销会籍。
        prompts:
          en:
            - "Should the By-Laws include a process for suspending or expelling a member for serious misconduct?"
            - "If yes, what process is required — who initiates it, who decides, and does the member have a right to be heard?"
            - "What should the threshold be: a majority Board vote? A supermajority?"
          zh:
            - "章程是否应包含因严重失范暂停或取消会籍的程序？"
            - "若是，须经何种程序——由谁启动、由谁裁决、当事会员是否有权陈述申辩？"
            - "门槛应如何设定：理事会多数通过？三分之二通过？"

      - id: "Q4.5"
        title:
          en: "Meeting Notice Periods"
          zh: "会议通知期限"
        context:
          en: >
            The current one-week notice for membership meetings is too short for a geographically
            dispersed membership.
          zh: >
            现行一周通知期对地域分散的会员而言过短。
        prompts:
          en:
            - "What notice period should apply to the annual membership meeting? (Most peer organizations use 21–30 days.)"
            - "Should the notice include a draft agenda, candidate biographies, and financial summaries so members can prepare?"
            - "Through what channels should notices be sent (email, WeChat, website)?"
          zh:
            - "年度会员大会应提前多少天发出通知？（大多数同类组织为21至30天。）"
            - "通知是否应附上议程草案、候选人简介和财务摘要，以便会员提前做好准备？"
            - "通知应通过哪些渠道发出（电子邮件、微信、网站）？"

  - id: "5"
    title:
      en: "Decision-Making Procedures"
      zh: "决策程序"
    description:
      en: >
        The current By-Laws leave out quorum rules for membership meetings, proxy voting,
        written consent, and a number of other procedural basics.
      zh: >
        现行章程未规定会员大会的法定人数、代投票规则、书面同意决议等多项程序要素。
    questions:
      - id: "Q5.1"
        title:
          en: "Quorum for Membership Meetings"
          zh: "会员大会的法定人数"
        context:
          en: >
            There is no quorum defined for membership meetings, meaning any number could technically
            pass a binding resolution.
          zh: >
            目前会员大会没有法定人数规定，理论上任意人数均可通过具有约束力的决议。
        prompts:
          en:
            - "Should quorum be a fixed number (e.g., 20 members) or a percentage of the membership roll?"
            - "What should the quorum threshold be?"
            - "What happens if quorum is not reached — automatic adjournment to a later date, or a non-binding advisory session?"
          zh:
            - "法定人数应以固定人数设定（例如：20名会员），还是以会员名册的一定比例设定？"
            - "法定人数门槛应为多少？"
            - "未达法定人数时如何处理——自动延期至另一日期，还是仅开展非约束性讨论？"

      - id: "Q5.2"
        title:
          en: "Proxy Voting and Electronic Pre-Voting"
          zh: "代投票与电子预投票"
        context:
          en: >
            Members who cannot attend the annual meeting currently have no way to vote.
          zh: >
            目前无法出席年度大会的会员没有任何表达意见的途径。
        prompts:
          en:
            - "Should proxy voting be permitted — can a member authorize another member to vote on their behalf at the meeting?"
            - "Alternatively (or additionally), should asynchronous electronic pre-voting before the meeting be permitted for certain votes (e.g., director elections)?"
            - "If electronic pre-voting is used, how are votes authenticated and counted alongside in-person votes?"
          zh:
            - "是否应允许代投票——会员是否可授权另一名会员在会议上代为投票？"
            - "是否还应允许会前的异步电子预投票（例如：针对理事选举等特定事项）？"
            - "若采用电子预投票，如何验证投票人身份，并与现场投票合并计票？"

      - id: "Q5.3"
        title:
          en: "Action by Written Consent"
          zh: "书面同意决议"
        context:
          en: >
            California law allows a Board to take action without holding a meeting if all (or a
            defined majority of) directors consent in writing. This is useful for urgent, routine,
            or administrative decisions.
          zh: >
            加州法律允许理事会在全体（或规定多数）理事以书面方式表示同意后，无须召开会议即可作出决定。
            这对紧急、日常或行政性决策尤为便利。
        prompts:
          en:
            - "Should the By-Laws authorize Board action by written consent (including email or electronic signature) without a formal meeting?"
            - "Should written consent require unanimity, or a supermajority?"
            - "Should any category of decisions be excluded from written consent (e.g., officer elections, major expenditures)?"
          zh:
            - "章程是否应授权理事会通过书面同意（包括电子邮件或电子签名）在不召开正式会议的情况下作出决定？"
            - "书面同意是否须全体一致，还是三分之二多数即可？"
            - "哪些类别的决策应排除在书面同意之外（例如：干部选举、重大支出）？"

      - id: "Q5.4"
        title:
          en: "Supermajority Requirements"
          zh: "超级多数要求"
        context:
          en: >
            Only By-Law amendments currently require a supermajority (two-thirds member vote).
            Should other decisions also require elevated thresholds?
          zh: >
            目前只有章程修订须经超级多数（出席会员三分之二）通过。是否还有其他决策应提高表决门槛？
        prompts:
          en:
            - "Which additional categories of decision, if any, should require more than a simple majority? Consider: dissolution; removal of an officer; expenditures above a certain dollar threshold; entering a major partnership or contract; changing the organization's name."
            - "For those decisions, what threshold is appropriate: two-thirds of those present, two-thirds of the full Board, three-fourths, or unanimous?"
          zh:
            - "除章程修订外，还有哪些类别的决策应要求高于简单多数的门槛？可考虑：解散、罢免干部、超出一定金额的支出、缔结重大合作关系或合同、更改组织名称。"
            - "对于上述决策，合适的门槛是多少：出席者三分之二、全体理事三分之二、四分之三，还是一致通过？"

      - id: "Q5.5"
        title:
          en: "Voting Mechanics and Conflict of Interest at the Chair"
          zh: "投票方式与会长利益冲突时的主持安排"
        context:
          en: >
            The By-Laws say nothing about how votes are taken at meetings, or what happens when
            the Chairman has a personal interest in a vote.
          zh: >
            现行章程对会议中的投票方式只字未提，也未规定当会长对某项表决事项存在个人利益时应如何处理。
        prompts:
          en:
            - "Should routine decisions use voice vote or show of hands, with secret ballot reserved for contested elections and sensitive matters (e.g., officer removal)?"
            - "When the Chairman has a personal interest in a matter being voted on, who should preside over that vote — the senior Vice Chairman, or a temporarily elected chair?"
            - "For virtual meetings, what voting mechanism is acceptable (e.g., chat message, in-platform poll, a separate form)?"
          zh:
            - "常规事项是否应以举手或口头表决，秘密投票保留用于有争议的选举和敏感事项（例如：罢免干部）？"
            - "当会长对某项表决事项存在个人利益时，应由谁主持该事项的表决——资深副会长，还是临时选定的会议主持人？"
            - "线上会议时，哪些投票方式是可接受的（例如：聊天消息、平台内置投票、单独表单）？"

  - id: "6"
    title:
      en: "California Law Compliance"
      zh: "加州法律合规"
    description:
      en: >
        The current By-Laws were written with little regard for the specific requirements of
        California's Nonprofit Mutual Benefit Corporation Law. This section addresses gaps
        that create legal risk.
      zh: >
        现行章程起草时几乎未考虑《加州非营利互益法人法》的具体要求。本节针对存在法律风险的几项空白进行说明。
    questions:
      - id: "Q6.1"
        title:
          en: "Director and Officer Indemnification"
          zh: "理事和干部的免责与赔偿保护"
        context:
          en: >
            California law permits nonprofits to protect directors and officers from personal
            liability for actions taken in good faith in their organizational roles. Without
            this protection, it may be difficult to recruit capable volunteers.
          zh: >
            加州法律允许非营利法人保护理事和干部免于因善意履行职务而承担个人责任。缺乏此类保护，
            可能导致难以招募有能力的志愿者担任领导职务。
        prompts:
          en:
            - "Should the By-Laws include an indemnification provision protecting directors and officers from personal liability for good-faith actions in their roles?"
            - "Should indemnification be mandatory (they must be indemnified if conditions are met) or permissive (the Board decides case by case)?"
            - "Should the organization purchase Directors and Officers (D&O) liability insurance?"
            - "What conduct should be excluded from protection (e.g., fraud, willful misconduct)?"
          zh:
            - "章程是否应包含免责条款，保护理事和干部免于因善意履行职务行为而承担个人责任？"
            - "免责保护应是强制性的（满足条件即须给予保护），还是授权性的（由理事会个案决定）？"
            - "本会是否应购买理事和干部责任险（D&O保险）？"
            - "哪些行为应排除在保护范围之外（例如：欺诈、故意不当行为）？"

      - id: "Q6.2"
        title:
          en: "Member Inspection Rights and State Filing Obligations"
          zh: "会员查阅权与州级申报义务"
        context:
          en: >
            California law gives members the right to inspect certain corporate records. It also
            requires corporations to file a biennial Statement of Information — failure to do so
            can result in suspension.
          zh: >
            加州法律赋予会员查阅特定公司文件的权利，同时要求法人每两年向州务卿提交信息申报表——未能
            按时提交可能导致法人资格被暂停。
        prompts:
          en:
            - "Should the By-Laws describe members' right to inspect records, and the process for requesting access (who to contact, how much notice, what documents are available)?"
            - "Who should be explicitly responsible in the By-Laws for filing the biennial Statement of Information with the California Secretary of State?"
            - "Should there be a Board-level check each year to confirm that state filings have been made?"
          zh:
            - "章程是否应描述会员的档案查阅权，以及提出查阅请求的程序（联系对象、提前通知时间、可查阅文件范围）？"
            - "章程应明确由谁负责向加州州务卿提交两年期信息申报表？"
            - "是否应设立理事会层面的年度核查机制，确认各项州级申报均已按时完成？"

      - id: "Q6.3"
        title:
          en: "Limiting Director Liability and Governing Law Reference"
          zh: "限制理事个人责任与引用加州法律"
        context:
          en: >
            California law permits nonprofits to limit directors' personal liability for monetary
            damages in certain circumstances.
          zh: >
            加州法律允许非营利法人在特定情形下限制理事就违反谨慎义务所承担的货币赔偿责任。
        prompts:
          en:
            - "Should the By-Laws include a clause limiting directors' personal liability for monetary damages for breach of the duty of care (to the extent permitted by California law)?"
            - "Should the By-Laws include a general provision stating that matters not addressed by the By-Laws are governed by California Nonprofit Corporation Law (Title 3, Part 3)?"
            - "Should the By-Laws reference California law explicitly in their text, or be written in plain language that is simply designed to comply with it?"
          zh:
            - "章程是否应包含条款，在加州法律允许的范围内限制理事因违反谨慎义务而承担的货币赔偿责任？"
            - "章程是否应包含总括性条款，规定章程未涉及的事项以《加州公司法》（第三章第三部分）为准？"
            - "章程是否应在正文中明确引用加州法律条文编号，还是仅以简明语言起草并确保实质合规？"

  - id: "7"
    title:
      en: "Financial Management"
      zh: "财务管理"
    description:
      en: >
        The current By-Laws address finances in a single paragraph: deposit funds in a federally
        insured bank; require two signatures for withdrawals. The entire modern financial
        operation of the organization is unaddressed.
      zh: >
        现行章程仅以一段文字涉及财务：将资金存入联邦保险银行，提款须双人签字。组织实际运营中的
        全部现代财务管理均未有规定。
    questions:
      - id: "Q7.1"
        title:
          en: "Expenditure Approval Thresholds"
          zh: "支出审批门槛"
        context:
          en: >
            There are no defined dollar thresholds for what the Treasurer can spend autonomously
            versus what requires Board approval.
          zh: >
            目前对财务长可自行核准的支出金额与须经理事会批准的金额，均无明确规定。
        prompts:
          en:
            - "Below what dollar amount may the Treasurer pay expenses without seeking additional approval (e.g., routine expenses under $200)?"
            - "Above what dollar amount does an expenditure require full Board approval before being made?"
            - "Should there be a middle tier — e.g., amounts between $200 and $2,000 approved jointly by the President and Treasurer without a full Board meeting?"
            - "How should emergency expenditures (e.g., a last-minute deposit) be handled?"
          zh:
            - "财务长可在不需额外审批的情况下自行支出的金额上限是多少（例如：200美元以下的日常支出）？"
            - "超过多少金额的支出，须在付款前取得全体理事会批准？"
            - "是否应设立中间层级——例如，200至2,000美元之间由会长和财务长联署批准，无需召开全体理事会？"
            - "紧急支出（例如：临时预付定金）应如何处理？"

      - id: "Q7.2"
        title:
          en: "Annual Budget and Financial Reporting"
          zh: "年度预算与财务报告"
        context:
          en: >
            There is currently no budget process or defined format for the Treasurer's annual report.
          zh: >
            目前既无预算编制程序，也无财务年度报告的规定格式。
        prompts:
          en:
            - "Should an annual budget be prepared and approved by the Board at the beginning of each fiscal year? Who prepares it?"
            - "Should the budget be presented to the membership at the annual meeting (for information or approval)?"
            - "What should the Treasurer's annual financial report include? (e.g., balance sheet, income statement, comparison to budget)"
            - "What is the organization's fiscal year — January 1 to December 31, or another period?"
          zh:
            - "是否应在每个财政年度开始前由理事会编制并批准年度预算？预算由谁起草？"
            - "预算是否应在年度会员大会上提交会员（供知悉或审批）？"
            - "财务年度报告应包含哪些内容？（例如：资产负债表、收支明细、预算执行对比）"
            - "本会的财政年度应为何时——1月1日至12月31日，还是其他周期？"

      - id: "Q7.3"
        title:
          en: "Modern Payment Methods and Digital Finance"
          zh: "现代支付方式与数字财务"
        context:
          en: >
            The current two-signature rule was written for paper checks, but most transactions now
            happen through PayPal, Zelle, Venmo, or similar platforms — which do not support
            two-person authorization.
          zh: >
            现行双签规定是为纸质支票设计的，但大多数交易现在通过PayPal、Zelle、Venmo等平台进行——
            这些平台不支持双人授权机制。
        prompts:
          en:
            - "Which digital payment platforms should be authorized for collecting dues and event fees?"
            - "How should the two-authorization requirement be adapted for digital transactions — for example, requiring both the President and Treasurer to approve a PayPal transfer before it is sent?"
            - "Should any account that holds organizational funds have two administrators at all times?"
            - "Can the organization hold a debit card, and if so, who controls it and what are the per-transaction limits?"
          zh:
            - "哪些数字支付平台应获批准用于收取会费和活动费用？"
            - "双重授权要求应如何适应数字交易——例如，要求会长和财务长在执行PayPal转账前均确认批准？"
            - "持有组织资金的每个账户是否应始终有两名干部拥有管理员权限？"
            - "本会是否可持有借记卡？若可以，由谁控制，每笔交易的限额是多少？"

      - id: "Q7.4"
        title:
          en: "Financial Review, Record Retention, and Treasurer Succession"
          zh: "财务审查、档案保存与财务职位空缺处理"
        context:
          en: >
            There are no requirements for independent financial review, record retention, or how
            to handle a mid-term Treasurer vacancy.
          zh: >
            目前没有独立财务审查要求，也没有档案保存规定，财务长职位中途空缺时的应对程序同样缺失。
        prompts:
          en:
            - "Should there be an independent financial review — an internal Finance Committee review, a CPA compilation, or a full external audit? At what revenue or asset level should this be required?"
            - "How long must financial records be retained, and in what format (digital, paper, cloud)?"
            - "If the Treasurer vacates mid-term, who immediately assumes signatory authority, and what is the timeline for a formal handover?"
          zh:
            - "是否应进行独立财务审查——内部财务委员会审查、注册会计师编制，还是全面外部审计？在何种收入或资产规模下应作为强制要求？"
            - "财务档案须保存多长时间，以何种格式保存（数字版、纸质版、云端存储）？"
            - "财务长职位中途空缺时，谁立即获得签字授权？正式交接的时间要求是多久？"

  - id: "8"
    title:
      en: "Meetings and Notices"
      zh: "会议与通知"
    description:
      en: >
        The current By-Laws require only one Board meeting per year, provide only one week's
        notice, and make no mention of virtual meetings.
      zh: >
        现行章程每年仅要求召开一次理事会会议，仅提前一周通知，且未涉及任何虚拟会议形式。
    questions:
      - id: "Q8.1"
        title:
          en: "Board Meeting Frequency and Format"
          zh: "理事会会议频率与形式"
        context:
          en: >
            One Board meeting per year is insufficient for active organizational oversight.
          zh: >
            每年一次理事会会议不足以有效履行组织监督职能。
        prompts:
          en:
            - "How many regular Board meetings should be required per year? (Most active peer organizations hold at least four — quarterly.)"
            - "Should the By-Laws distinguish between formal Board meetings (with quorum requirements and minutes) and shorter informal check-ins?"
            - "Should virtual Board meetings (e.g., via Zoom) be explicitly authorized, and should virtual participation count equally toward quorum?"
          zh:
            - "每年应规定召开几次理事会例会？（大多数活跃的同类组织至少每季度举行一次，即每年四次。）"
            - "章程是否应区分正式理事会会议（有法定人数要求和会议记录）与简短的非正式沟通会？"
            - "是否应明确授权虚拟理事会会议（例如通过Zoom召开），线上参会是否等同于现场出席并计入法定人数？"

      - id: "Q8.2"
        title:
          en: "Notice Periods and Content"
          zh: "通知期限与通知内容"
        context:
          en: >
            One week's advance notice is very short for a geographically dispersed membership or board.
          zh: >
            一周的提前通知对地域分散的会员或理事而言非常仓促。
        prompts:
          en:
            - "What notice period should apply to: the annual membership meeting; regular Board meetings; special/emergency Board meetings?"
            - "What information must a meeting notice include? (e.g., date, time, location/link, agenda, candidate list, financial report, proposed amendments)"
            - "Should notice via WeChat be formally recognized as a valid and official notification channel?"
          zh:
            - "以下会议的通知期限分别应规定为多少：年度会员大会；理事会例会；特别/紧急理事会会议？"
            - "会议通知须包含哪些内容？（例如：日期、时间、地点/链接、议程、候选人名单、财务报告、拟议修订条款）"
            - "微信通知是否应被正式认定为有效的官方通知渠道？"

      - id: "Q8.3"
        title:
          en: "Meeting Records and Quorum Failure"
          zh: "会议记录与未达法定人数时的处理"
        context:
          en: >
            The By-Laws have no rules for minutes at membership meetings, and no procedure for
            what happens when a meeting cannot reach quorum.
          zh: >
            章程对会员大会的记录没有任何规定，对未达法定人数时的处理程序也无规定。
        prompts:
          en:
            - "Should full minutes be taken at every Board meeting and annual membership meeting, approved at the following meeting, and made accessible to all members?"
            - "If the annual membership meeting fails to reach quorum, should it be automatically adjourned to a later date at which any attending members constitute quorum?"
            - "Should there be a fixed target time of year for the annual membership meeting (e.g., within the first quarter of each year)?"
          zh:
            - "是否应要求在每次理事会会议和年度会员大会上记录完整会议记录，并在下次会议上审议通过，同时向全体会员公开存档？"
            - "若年度会员大会未达法定人数，是否应自动延期至另一日期，届时出席者即构成法定人数？"
            - "年度会员大会是否应固定在每年的特定时间段召开（例如：每年第一季度内）？"

  - id: "9"
    title:
      en: "Digital Operations and Communications"
      zh: "数字运营与通讯"
    description:
      en: >
        The current By-Laws were drafted in 2002. The organization's actual operations —
        WeChat, website, social media, digital payments, electronic documents — exist
        entirely outside the governing document.
      zh: >
        现行章程起草于2002年，组织的实际运营工具——微信、网站、社交媒体、数字支付、电子文档——
        在治理文件中完全不存在。
    questions:
      - id: "Q9.1"
        title:
          en: "Official Communication Channels"
          zh: "官方通讯渠道"
        context:
          en: >
            The organization communicates through email, WeChat, possibly a website, and other
            platforms, but none of these are recognized in the governing documents.
          zh: >
            本会通过电子邮件、微信、网站等平台进行沟通，但这些渠道均未得到章程的正式认可。
        prompts:
          en:
            - "Which channels should be designated as \"official\" for membership notices, Board communications, and organizational announcements? (e.g., email; a specific WeChat group; the official website)"
            - "Should WeChat group messages from officers be treated as official organizational communications, or as personal communications unless specifically labeled otherwise?"
            - "Should the organization maintain a single canonical membership email list that members are required to subscribe to?"
          zh:
            - "哪些渠道应被指定为会员通知、理事会通讯和组织公告的\"官方\"渠道？（例如：电子邮件；特定微信群；官方网站）"
            - "干部在微信群中的发言是否应视为官方组织通讯，还是仅属个人通讯，须特别标注才具有官方性质？"
            - "本会是否应维护一个统一的官方会员电子邮件列表，要求会员订阅？"

      - id: "Q9.2"
        title:
          en: "Digital Asset Ownership and Account Handover"
          zh: "数字资产所有权与账号交接"
        context:
          en: >
            When an officer leaves, they may retain access to accounts they set up personally —
            domain names, email addresses, social media accounts, WeChat groups.
          zh: >
            当干部离任时，其以个人名义注册的账号——域名、电子邮箱、社交媒体账号、微信群——
            可能仍由其保留控制权。
        prompts:
          en:
            - "Should all organizational digital accounts (domain, website, email, social media) be owned by the organization rather than by any individual officer?"
            - "Should the By-Laws require at least two officers to have admin access to each official digital account at all times?"
            - "What should the deadline be for a departing officer to transfer all account credentials to their successor, and what happens if they refuse?"
          zh:
            - "所有组织数字账号（域名、网站、电子邮箱、社交媒体）是否应以组织名义持有，而非由任何干部个人持有？"
            - "章程是否应规定，每个官方数字账号始终应有至少两名干部拥有管理员权限？"
            - "离任干部移交所有账号凭据的截止期限是多久？若拒绝配合交接，应如何处理？"

      - id: "Q9.3"
        title:
          en: "Member Data Privacy"
          zh: "会员数据隐私"
        context:
          en: >
            The membership roll contains personal data (names, contact information, alumni details).
            There are no rules for how this data is used, stored, or protected.
          zh: >
            会员名册包含个人数据（姓名、联系方式、校友信息）。目前对这些数据的使用、存储和保护没有任何规定。
        prompts:
          en:
            - "Should the organization adopt a privacy policy covering how member data is collected, stored, and used?"
            - "Should member data be stored in an officially designated system (not in an individual officer's personal files)?"
            - "Should there be restrictions on who within the organization can access the full membership roll?"
            - "Should the organization acknowledge any obligations under the California Consumer Privacy Act (CCPA)?"
          zh:
            - "本会是否应制定隐私政策，规范会员数据的收集、存储和使用方式？"
            - "会员数据是否应存储于指定的官方系统中，而非存放于干部个人文件中？"
            - "组织内部谁可以查阅完整会员名册，是否应作出限制？"
            - "本会是否应承认其在《加州消费者隐私法》（CCPA）下的相关义务？"

      - id: "Q9.4"
        title:
          en: "Digital Records and Electronic Voting Integrity"
          zh: "数字档案管理与电子投票的安全性"
        context:
          en: >
            There are no rules for how digital records are organized, retained, or backed up, and
            electronic voting is referenced in the By-Laws but completely unspecified.
          zh: >
            目前对数字档案的整理、保存和备份没有任何规定，章程虽提及电子投票，但完全未加规范。
        prompts:
          en:
            - "Should the organization maintain a central shared digital archive (e.g., a shared Google Drive) accessible to all Board members, organized by year and document type?"
            - "Which platforms or tools are approved for conducting member votes electronically? How is voter identity verified and vote integrity maintained?"
            - "Should electronic votes be archived as part of the organization's official records?"
          zh:
            - "本会是否应维护一个统一的共享数字档案库（例如：共享Google云盘），供所有理事访问，按年份和文件类型分类整理？"
            - "哪些平台或工具被批准用于开展会员电子投票？如何验证投票人身份并保障投票结果的完整性？"
            - "电子投票记录是否应作为组织官方档案的一部分予以存档？"

  - id: "10"
    title:
      en: "Committees"
      zh: "委员会"
    description:
      en: >
        The current By-Laws contain no committee structure at all. Any committees that currently
        exist have no formal standing, authority, or accountability.
      zh: >
        现行章程完全没有委员会架构。现有的任何委员会均无正式地位、无授权依据、无问责机制。
    questions:
      - id: "Q10.1"
        title:
          en: "Which Standing Committees Should Be Established?"
          zh: "应设立哪些常设委员会？"
        context:
          en: >
            The Board must decide which committees are important enough to be defined in the By-Laws,
            versus which should be created informally as needed.
          zh: >
            理事会须决定哪些委员会重要到须在章程中明确设立，哪些可根据需要以非正式方式临时组建。
        prompts:
          en:
            - "Should any of the following be established as named standing committees? Finance Committee (reviews financial reports); Election/Nominating Committee (independently administers nominations and elections); Events Committee (plans annual banquet and major events); Membership Committee (manages the membership roll and dues); Communications Committee (manages website, email, WeChat, and public presence); SCUT Relations Committee (coordinates with SCUT's alumni office); Young Alumni Committee (engages new graduates and current SCUT students in the U.S.)"
            - "Are there other committees important to the organization's actual operations that are not on this list?"
          zh:
            - "以下各项是否应作为命名常设委员会在章程中正式设立？财务委员会（审查财务报告，为理事会提供财务建议）；选举/提名委员会（独立管理候选人提名和选举程序）；活动委员会（筹划年度晚会及其他重大活动）；会员委员会（管理会员名册、负责会费收取）；通讯委员会（管理网站、电子邮件、微信及对外宣传）；华工关系委员会（与华工校友办公室协调沟通）；青年校友委员会（联络应届毕业生和在美华工学生）"
            - "还有哪些对本会运营实际至关重要、但上述列表未涵盖的委员会？"

      - id: "Q10.2"
        title:
          en: "Committee Authority, Composition, and Accountability"
          zh: "委员会的职权、构成与问责机制"
        context:
          en: >
            For each committee that will be established, the By-Laws must define who sits on it,
            what it can decide, and how it reports back.
          zh: >
            对于将正式设立的每个委员会，章程须界定其人员构成、决策权限及向理事会汇报的方式。
        prompts:
          en:
            - "Should committee members be required to be current members in good standing, or can non-member volunteers serve in an operational capacity?"
            - "Who appoints committee chairs — the President, the Board, or the committee members?"
            - "Can a committee take binding action on its own (e.g., approve an event venue), or can it only make recommendations to the Board?"
            - "Should spending authority be delegated to specific committees within a Board-approved budget?"
            - "Should each standing committee be required to provide a written report at each regular Board meeting and an annual report at the annual membership meeting?"
          zh:
            - "委员会成员是否须为良好会籍状态的正式会员，还是可由非会员志愿者担任运营性职务？"
            - "委员会主席由谁任命——会长、理事会，还是委员会成员自行推选？"
            - "委员会能否自行作出约束性决定（例如：批准活动场地），还是只能向理事会提出建议？"
            - "是否应在理事会批准的预算范围内向特定委员会授权支出？"
            - "每个常设委员会是否须在每次理事会例会上提交书面报告，并在年度会员大会上提交年度报告？"

  - id: "11"
    title:
      en: "Conflict of Interest"
      zh: "利益冲突"
    description:
      en: >
        The current By-Laws contain no conflict of interest provisions. California law
        (Corporations Code §7233) regulates self-dealing by directors of nonprofit mutual
        benefit corporations, but the By-Laws must set out how the organization will
        implement that requirement.
      zh: >
        现行章程完全没有利益冲突条款。加州《公司法》第7233条规范了非营利互益法人理事的自我交易行为，
        但章程须说明组织将如何落实这一要求。
    questions:
      - id: "Q11.1"
        title:
          en: "Scope and Disclosure"
          zh: "适用范围与披露要求"
        context:
          en: >
            A conflict of interest policy is only useful if the organization can clearly identify
            when a conflict exists and ensure it is disclosed.
          zh: >
            利益冲突政策只有在组织能够清晰识别冲突存在、并确保及时披露的情况下，才能发挥实际作用。
        prompts:
          en:
            - "What should count as a conflict of interest? Should the policy cover: financial conflicts only; or also personal relationships (e.g., contracting with a family member's business); or situations where the director's employer has an interest in a Board decision?"
            - "Who is subject to the policy — only Board directors, or also officers, committee chairs, and major volunteers?"
            - "Should all directors be required to submit a written annual disclosure listing any relationships or interests that could constitute a conflict?"
          zh:
            - "哪些情形应构成利益冲突？政策应仅涵盖财务性冲突，还是也包括个人关系（例如：向家属所在机构签订合同）；或理事所在雇主对某项理事会决策有利益关涉的情形？"
            - "政策适用于哪些人——仅限理事，还是也包括干部、委员会主席和主要志愿者？"
            - "是否应要求所有理事每年提交书面年度申报表，列明可能构成利益冲突的关系和利益？"

      - id: "Q11.2"
        title:
          en: "Recusal, Voting, and Consequences"
          zh: "回避、表决与违规后果"
        context:
          en: >
            Once a conflict is disclosed, the Board must decide how the affected director is treated.
          zh: >
            一旦披露利益冲突，理事会须确定如何处置存在利益关系的理事。
        prompts:
          en:
            - "Should an interested director be permitted to participate in discussion before recusing, or must they leave immediately?"
            - "Should the interested director's presence be excluded from the quorum count for the vote on the conflicted matter?"
            - "What are the consequences of failing to disclose a known conflict — a warning for a first offense, removal proceedings for a serious or repeated violation?"
            - "Should a transaction approved without proper disclosure of a conflict be voidable (reversible)?"
          zh:
            - "存在利益关系的理事是否可以参与讨论后再回避，还是须立即离席？"
            - "存在利益关系的理事，其出席是否应从该事项表决的法定人数中排除？"
            - "未披露已知利益冲突的后果是什么——首次警告，再犯时启动罢免程序？"
            - "未经适当利益披露而批准的交易，是否应可撤销（即可被推翻）？"

  - id: "12"
    title:
      en: "Dissolution"
      zh: "解散"
    description:
      en: >
        The current By-Laws say nothing about how the organization would be dissolved. This is
        both a legal gap and a practical one: if the organization ever becomes inactive, there
        must be a defined process for winding down.
      zh: >
        现行章程对如何解散组织只字未提。这既是法律漏洞，也是实务隐患：若本会日后陷入休眠状态，
        必须有明确的清算程序。
    questions:
      - id: "Q12.1"
        title:
          en: "Conditions, Authority, and Vote Threshold"
          zh: "解散条件、发起权与表决门槛"
        context:
          en: ""
          zh: ""
        prompts:
          en:
            - "Should dissolution only be possible in extreme circumstances (e.g., sustained inactivity, leadership vacuum), or should it be an ordinary governance decision available at any time?"
            - "Who can initiate a dissolution vote — the Board alone; the membership by petition; any officer?"
            - "What vote is required to approve dissolution? (Recommended minimum: two-thirds of the full Board, followed by two-thirds of members at a specially noticed membership meeting.)"
            - "Should the notice period for a dissolution vote be longer than for ordinary amendments — for example, 60 days instead of 30?"
          zh:
            - "解散是否应仅限于极端情形（例如：长期处于非活跃状态、无人愿意担任领导职务），还是可视为任何时候均可作出的普通治理决策？"
            - "谁有权发起解散表决——仅限理事会；会员联署请愿；或任何干部？"
            - "批准解散须经何种表决门槛？（建议最低要求：全体理事三分之二同意，继以在专项通知会员大会上出席会员三分之二同意。）"
            - "解散表决的通知期是否应长于普通修订通知期——例如60天而非30天？"

      - id: "Q12.2"
        title:
          en: "Asset Distribution"
          zh: "剩余资产的分配"
        context:
          en: >
            California law and IRS 501(c)(7) rules prohibit distributing organizational assets
            to members for personal benefit upon dissolution. The organization must specify
            where remaining assets go.
          zh: >
            加州法律和IRS 501(c)(7)规定禁止将组织资产在解散时作为个人利益分配给会员。
            组织须明确剩余资产的归属。
        prompts:
          en:
            - "Should remaining assets after paying all debts go to: another SCUT alumni organization; SCUT directly; a specified Chinese-American nonprofit or community foundation; or a recipient chosen by the Board at the time of dissolution?"
            - "If the organization names a specific recipient, what is the fallback if that recipient no longer exists?"
            - "Should there be a merger or reorganization pathway as an alternative to full dissolution?"
          zh:
            - "偿清全部债务后，剩余资产应归属于：其他华工校友组织；华南理工大学本身；指定的美国华人非营利机构或社区基金；还是由届时的理事会自行选择受益方？"
            - "若章程指定了特定受益机构，届时该机构已不存在，备选方案是什么？"
            - "是否应在章程中设置合并或重组路径，作为全面解散的替代方案？"

  - id: "13"
    title:
      en: "Federal IRS 501(c)(7) Compliance"
      zh: "联邦IRS 501(c)(7)合规"
    description:
      en: >
        The current By-Laws do not mention the organization's federal tax-exempt status.
        This section addresses governance provisions needed to protect and maintain that status.
      zh: >
        现行章程未提及本会的联邦免税地位。本节讨论维护和保障该地位所需的治理条款。
    questions:
      - id: "Q13.1"
        title:
          en: "Declaring and Maintaining 501(c)(7) Status"
          zh: "声明并维持501(c)(7)地位"
        context:
          en: ""
          zh: ""
        prompts:
          en:
            - "Should the By-Laws include an explicit statement that the organization is organized and operated as a tax-exempt social club under IRC §501(c)(7)?"
            - "Does the organization currently hold an IRS determination letter confirming 501(c)(7) status? If not, should obtaining one be a near-term priority?"
            - "Should the By-Laws include a commitment to operate in compliance with 501(c)(7) requirements, so that Board members have a clear fiduciary duty to protect tax-exempt status?"
          zh:
            - "章程是否应包含明确声明，表明本会依据IRC第501(c)(7)条组织和运营，作为免税社交俱乐部？"
            - "本会目前是否持有IRS颁发的确认501(c)(7)地位的认定函？如果没有，申请认定函是否应列为近期优先事项？"
            - "章程是否应包含遵守501(c)(7)要求运营的承诺，使理事会对维护免税地位承担明确的受托义务？"

      - id: "Q13.2"
        title:
          en: "Annual IRS Filing and Revenue Monitoring"
          zh: "年度IRS申报与总收入构成监控"
        context:
          en: >
            501(c)(7) organizations must file an annual Form 990 with the IRS. They must also
            ensure that at least 65% of gross receipts come from members.
          zh: >
            持有501(c)(7)地位的组织须每年向IRS申报Form 990，同时须确保至少65%的总收入来自会员。
        prompts:
          en:
            - "Should the By-Laws explicitly assign IRS annual filing responsibility to the Treasurer, with oversight by the Board (i.e., the Board reviews and approves the Form 990 before it is filed)?"
            - "Should a CPA or tax professional be engaged to prepare the Form 990, and should the Board authorize this expense in the annual budget?"
            - "Should the Treasurer be required to track member revenue vs. non-member revenue throughout the year and report the composition to the Board? At what point should an alert be triggered if non-member revenue approaches the 35% IRS ceiling?"
          zh:
            - "章程是否应明确将IRS年度申报责任分配给财务长，并由理事会负责监督（即理事会在申报前审查并批准Form 990）？"
            - "是否应聘请注册会计师或税务专业人员准备Form 990，并将该费用列入年度预算？"
            - "是否应要求财务长在全年分别追踪会员收入与非成员收入，并向理事会报告收入构成？当非成员收入逼近IRS规定的35%上限时，应在何时发出预警？"

      - id: "Q13.3"
        title:
          en: "Non-Member Activity, Private Inurement, and Non-Discrimination"
          zh: "非成员活动、私利归属禁止与非歧视声明"
        context:
          en: >
            501(c)(7) rules limit non-member income and prohibit private benefit to individuals.
            IRS policy also prohibits discrimination based on race, color, or religion.
          zh: >
            501(c)(7)规则限制非成员收入的比例，并禁止将任何净收益归属于个人。IRS政策还禁止基于
            种族、肤色或宗教实施歧视的组织享有501(c)(7)免税地位。
        prompts:
          en:
            - "Should the By-Laws include an explicit private inurement prohibition — stating that no part of net earnings shall inure to the benefit of any individual member, director, or officer?"
            - "Should the organization establish a Board-approval requirement before accepting any corporate sponsorship or large non-member donation, to manage 501(c)(7) compliance?"
            - "Should the By-Laws include a non-discrimination statement? Should it cover only what IRS requires (race, color, religion) or be broader (e.g., national origin, gender, sexual orientation)?"
          zh:
            - "章程是否应包含明确的私利归属禁止条款，声明净收益的任何部分不得归属于任何个人会员、理事或干部？"
            - "是否应规定，在接受任何企业赞助或非成员的大额捐款之前，须先获得理事会批准，以管控501(c)(7)合规风险？"
            - "章程是否应包含非歧视声明？是否应仅满足IRS最低要求（种族、肤色、宗教），还是应采用更宽泛的当代表述（例如：国籍、性别、性取向）？"

      - id: "Q13.4"
        title:
          en: "Record Retention and Response to Loss of Tax-Exempt Status"
          zh: "档案保存与应对免税地位丧失"
        context:
          en: >
            Under the Pension Protection Act of 2006, three consecutive years of failing to file
            a Form 990 result in automatic loss of tax-exempt status.
          zh: >
            依据2006年《养老金保护法》，连续三年未提交Form 990的组织将自动丧失免税地位。
        prompts:
          en:
            - "Should the By-Laws specify a minimum retention period for financial and tax records — for example, seven years from the date of the relevant filing?"
            - "Should the IRS determination letter (if one exists) and all Form 990 filings be retained permanently?"
            - "Should the By-Laws establish a procedure for what happens if the organization's 501(c)(7) status is revoked — who is responsible for initiating reinstatement, and should there be an automatic special Board meeting within 30 days of discovering the revocation?"
          zh:
            - "章程是否应规定财务和税务档案的最低保存期限——例如，自相关申报日期起七年？"
            - "IRS认定函（如有）和全部Form 990申报副本是否应永久保存？"
            - "章程是否应规定本会501(c)(7)地位被撤销时的处置程序——明确由谁负责启动恢复程序，并规定在知悉撤销之日起30天内须自动召开特别理事会会议？"

summary:
  title:
    en: "Summary: Your Top Priorities"
    zh: "总结：您的优先事项"
  description:
    en: >
      Once you have worked through the sections above, please take a few minutes to step back
      and share your overall perspective.
    zh: >
      在完成上述各节内容后，请花几分钟退后一步，分享您的总体看法。
  questions:
    - id: "S1"
      title:
        en: "Most Important Changes"
        zh: "最重要的变化"
      context:
        en: >
          In your view, what are the three most important changes to make in the revised
          By-Laws? These can be new provisions that are currently missing, or improvements
          to existing provisions.
        zh: >
          在您看来，修订章程中最重要的三项变化是什么？可以是目前缺失的新条款，也可以是对现有条款的改进。
      prompts:
        en: []
        zh: []

    - id: "S2"
      title:
        en: "Areas Where the Organization Should Be Conservative"
        zh: "应保持稳定的领域"
      context:
        en: >
          Are there areas where you think the organization should not change significantly —
          provisions that are working well and should be preserved or only lightly updated?
        zh: >
          在哪些方面，您认为本会不应作出重大变化——哪些现有规定运行良好，应予保留或仅作小幅调整？
      prompts:
        en: []
        zh: []

    - id: "S3"
      title:
        en: "Concerns About Practicality"
        zh: "对可行性的顾虑"
      context:
        en: >
          Are there proposed changes (from this questionnaire or from any other source) that
          you think would be difficult to implement given the organization's current size,
          resources, or volunteer capacity? Please flag them.
        zh: >
          考虑到本会当前的规模、资源和志愿者承担能力，是否有些拟议的变化在您看来难以落实？请指出。
      prompts:
        en: []
        zh: []

    - id: "S4"
      title:
        en: "Anything Else"
        zh: "其他意见"
      context:
        en: >
          Is there any governance issue, concern, or proposal that this questionnaire did
          not cover — or any topic you feel deserves more attention than this questionnaire gave it?
        zh: >
          本问卷是否有遗漏的治理问题或关切事项？是否有某个议题应当给予比本问卷更多的关注？
      prompts:
        en: []
        zh: []
